<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - LCDICyG</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="contacto-page">

    <nav class="servicios-nav">
        <a href="index.html">Inicio</a>
        <a href="acerca.html">Acerca</a>
        <a href="servicios.html" class="active-link">Servicios</a>
    </nav>

    <main class="contacto-main">

        <h1>Formulario de contacto</h1>

        <form class="contacto-form" id="contactForm">

            <div class="form-group">
                <label>Nombre Completo <span class="required">*</span></label>
                <input type="text" id="nombre" placeholder="Escribe tu nombre completo">
                <small class="error-message">* Campo obligatorio</small>
            </div>

            <div class="form-group">
                <label>Correo Electrónico <span class="required">*</span></label>
                <input type="email" id="correo" placeholder="Escribe tu correo electrónico">
                <small class="error-message">* Campo obligatorio</small>
            </div>

            <div class="form-group">
                <label>Mensaje</label>
                <textarea id="mensaje" placeholder="Escribe aquí tu mensaje"></textarea>
            </div>

            <button type="submit" class="contact-button" id="contactButton">
                Enviar mensaje
            </button>

            <p class="form-status" id="formStatus"></p>

        </form>

    </main>

    <script src="js/main.js"></script>
</body>
</html>
